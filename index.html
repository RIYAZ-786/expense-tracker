<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Expense Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    h1, h2 {
      text-align: center;
      color: #333;
    }
    #addUserBtn {
      text-align: right;
      margin-bottom: 20px;
    }
    button {
      padding: 8px 16px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background-color: #218838;
    }
    input, select {
      padding: 8px;
      width: 250px;
      margin: 5px auto;
      display: block;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    #wrapper table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }
    #wrapper th, #wrapper td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    #wrapper th {
      background-color: #343a40;
      color: white;
    }
    #total {
      text-align: center;
      color: #218838;
      margin-top: 10px;
      font-weight: bold;
      font-size: 18px;
    }
    .popup {
      display: none;
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -20%);
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.3);
      z-index: 999;
    }
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 998;
    }
    #filterSection {
      text-align: center;
      margin-top: 20px;
    }
    .action-btn {
      background-color: #007bff;
    }
    .delete-btn {
      background-color: #dc3545;
    }
  </style>
</head>
<body onload="showdata()">

  <h1>Expense Tracker</h1>

  <div id="addUserBtn">
    <button onclick="showpopup()">Add New Expense</button>
  </div>

  <div id="filterSection">
    <label for="filterCat">Filter by Category:</label>
    <select id="filterCat" onchange="showdata()">
      <option value="all">All</option>
      <option value="Transport">Transport</option>
      <option value="Food">Food</option>
      <option value="Shopping">Shopping</option>
      <option value="Other">Other</option>
    </select>
  </div>

  <h2>My Expense List</h2>
  <div id="wrapper"></div>
  <div id="total"></div>

  <!-- Popup Form -->
  <div class="overlay" id="overlay" onclick="hidepopup()"></div>
  <div class="popup" id="popup">
    <h2 id="popup-title">Add New Expense</h2>
    <input type="text" id="ename" placeholder="Expense Name">
    <input type="number" id="eamount" placeholder="Expense Amount">
    <select id="ecat">
      <option value="">--Select category--</option>
      <option value="Transport">Transport</option>
      <option value="Food">Food</option>
      <option value="Shopping">Shopping</option>
      <option value="Other">Other</option>
    </select>
    <button onclick="saveExpense()">Save</button>
    <button onclick="hidepopup()">Cancel</button>
  </div>

  <script>
    let expenselist = [];
    let editIndex = -1;

    function showpopup(index = -1) {
      editIndex = index;

      if (index >= 0) {
        // Editing existing
        document.getElementById("popup-title").innerText = "Edit Expense";
        const e = expenselist[index];
        document.getElementById("ename").value = e.name;
        document.getElementById("eamount").value = e.amount;
        document.getElementById("ecat").value = e.category;
      } else {
        document.getElementById("popup-title").innerText = "Add New Expense";
        clearForm();
      }

      document.getElementById("popup").style.display = "block";
      document.getElementById("overlay").style.display = "block";
    }

    function hidepopup() {
      document.getElementById("popup").style.display = "none";
      document.getElementById("overlay").style.display = "none";
      clearForm();
    }

    function clearForm() {
      document.getElementById("ename").value = "";
      document.getElementById("eamount").value = "";
      document.getElementById("ecat").value = "";
    }

    function saveExpense() {
      let storedList = localStorage.getItem("list");
      if (storedList) expenselist = JSON.parse(storedList);

      const n = document.getElementById("ename").value.trim();
      const a = document.getElementById("eamount").value.trim();
      const c = document.getElementById("ecat").value;
      const d = new Date().toLocaleString();

      if (!n || !a || !c) {
        alert("Please fill all fields!");
        return;
      }

      if (editIndex >= 0) {
        // Edit
        expenselist[editIndex].name = n;
        expenselist[editIndex].amount = a;
        expenselist[editIndex].category = c;
        expenselist[editIndex].doe = d;
      } else {
        // Add
        let newObj = {
          id: expenselist.length + 1,
          name: n,
          amount: a,
          category: c,
          doe: d
        };
        expenselist.push(newObj);
      }

      localStorage.setItem("list", JSON.stringify(expenselist));
      hidepopup();
      showdata();
    }

    function showdata() {
      const selectedCategory = document.getElementById("filterCat")?.value || "all";
      let temp = `<table>
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th>Amount</th>
          <th>Category</th>
          <th>Date/Time</th>
          <th>Actions</th>
        </tr>`;

      const stored = localStorage.getItem("list");
      if (stored) {
        expenselist = JSON.parse(stored);
        const filtered = selectedCategory === "all"
          ? expenselist
          : expenselist.filter(e => e.category === selectedCategory);

        filtered.forEach((e, index) => {
          const originalIndex = expenselist.findIndex(item => item.id === e.id);
          temp += `<tr>
            <td>${e.id}</td>
            <td>${e.name}</td>
            <td>${e.amount}</td>
            <td>${e.category}</td>
            <td>${e.doe}</td>
            <td>
              <button class="action-btn" onclick="showpopup(${originalIndex})">Edit</button>
              <button class="delete-btn" onclick="deleteExpense(${originalIndex})">Delete</button>
            </td>
          </tr>`;
        });

        showtotal(filtered);
      } else {
        expenselist = [];
        showtotal([]);
      }

      temp += "</table>";
      document.getElementById("wrapper").innerHTML = temp;
    }

    function deleteExpense(index) {
      if (confirm("Are you sure you want to delete this expense?")) {
        expenselist.splice(index, 1);
        // Reassign IDs
        expenselist.forEach((e, i) => e.id = i + 1);
        localStorage.setItem("list", JSON.stringify(expenselist));
        showdata();
      }
    }

    function showtotal(list = expenselist) {
      let t = 0;
      list.forEach(e => {
        t += parseFloat(e.amount);
      });
      document.getElementById("total").innerHTML = "<h3>Total Amount: ₹ " + t.toFixed(2) + "</h3>";
    }
  </script>
</body>
</html>
